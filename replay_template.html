<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ symbol }} Trade Replay Pro</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-panel: #131a2a;
            --border: #1e2a3a;
            --text-main: #e0e0e0;
            --text-muted: #667788;
            --green: #00e676;
            --red: #ff1744;
            --accent: #1a73e8;
            --oi-color: #ffab40;
            --cvd-color: #ba68c8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0d1321 0%, #141c2e 100%);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .badge {
            background: var(--accent);
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .main-content {
            display: flex;
            flex: 1;
            height: calc(100vh - 120px);
        }

        .chart-section {
            flex: 1;
            position: relative;
        }

        #chart-container {
            width: 100%;
            height: 100%;
        }

        .resizer {
            width: 4px;
            background: var(--border);
            cursor: col-resize;
            transition: background 0.2s;
            z-index: 10;
        }

        .resizer:hover,
        .resizer:active {
            background: var(--accent);
        }

        .trades-section {
            width: 420px;
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            position: relative;
        }

        .trades-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1.2fr 0.9fr 1fr 1.3fr;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .trades-list {
            flex: 1;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
        }

        .trade-row {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr 1fr 1.3fr;
            padding: 4px 16px;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            animation: flash 0.3s ease-out;
        }

        @keyframes flash {
            0% {
                background: rgba(255, 255, 255, 0.1);
            }

            100% {
                background: transparent;
            }
        }

        .trade-row.buy .price {
            color: var(--green);
        }

        .trade-row.sell .price {
            color: var(--red);
        }

        .trade-row .price {
            font-weight: 600;
        }

        .trade-row .qty {
            text-align: right;
            color: #ccc;
        }

        .trade-row .time {
            text-align: right;
            color: var(--text-muted);
        }

        .whale-glow {
            background: rgba(255, 235, 59, 0.15) !important;
            animation: flashWhale 1s ease-out;
        }

        @keyframes flashWhale {
            0% {
                background: rgba(255, 235, 59, 0.6);
            }

            100% {
                background: transparent;
            }
        }

        .controls-section {
            height: 70px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 12px;
        }

        .transport-btns {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .play-btn {
            background: var(--accent);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .play-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .skip-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text-main);
            height: 34px;
            padding: 0 10px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .skip-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: #3a4a6a;
        }

        .progress-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .time-label {
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            color: var(--text-muted);
            min-width: 75px;
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .settings-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        select,
        input[type="number"] {
            background: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            font-family: inherit;
            outline: none;
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 14, 23, 0.9);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            background-color: var(--bg-panel);
            min-width: 150px;
            box-shadow: 0px -8px 16px 0px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 0;
            z-index: 100;
            margin-bottom: 8px;
        }
        
        .dropdown-content label {
            color: var(--text-main);
            padding: 8px 16px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        .dropdown-content label:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .dropdown.show .dropdown-content {
            display: block;
        }
        
        .dropdown-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text-main);
            height: 30px;
            padding: 0 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .dropdown-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .indicator-labels {
            display: flex;
            gap: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 20px;
        }

        .label-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .color-box {
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }
    </style>
</head>

<body>

    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div id="loading-text">Veriler yükleniyor (Buffer)...</div>
        <div style="font-size:12px; color:#aaa" id="loading-progress"></div>
    </div>

    <div class="header">
        <div class="title-area">
            <div class="badge">{{ symbol }}</div>
            <div style="font-size: 14px; color: #8899aa;">{{ source_title }} Trade Replay Pro</div>
        </div>
        <div style="font-size: 13px; color: #8899aa;" id="current-price-display"></div>
    </div>

    <div class="main-content">
        <div class="chart-section">
            <div id="chart-legend"
                style="position: absolute; left: 12px; top: 12px; z-index: 10; font-size: 13px; color: #e0e0e0; pointer-events: none; background: rgba(10, 14, 23, 0.7); padding: 8px; border-radius: 6px; display: none; font-variant-numeric: tabular-nums;">
            </div>
            <div id="chart-container"></div>
        </div>
        <div class="resizer" id="resizer"></div>
        <div class="trades-section">
            <div style="position: absolute; top:-40px; right: 10px; z-index:20;">
                <label style="font-size:11px; color:#8899aa; font-weight:bold;">Balina Filtresi ($): </label>
                <input type="number" id="whale-filter" value="0" style="width: 80px; padding: 4px 8px;"
                    title="Minimum Islem Hacmi (USDT)">
            </div>

            <div class="trades-header">
                <div>Fiyat</div>
                <div style="text-align: right;">Miktar</div>
                <div style="text-align: right;">Toplam($)</div>
                <div style="text-align: right;">Zaman</div>
            </div>
            <div class="trades-list" id="trades-list"></div>
        </div>
    </div>

    <div class="controls-section">
        <div class="transport-btns">
            <button class="skip-btn" onclick="skipTrades(-100)" title="100 islem geri">-100</button>
            <button class="skip-btn" onclick="skipTrades(-10)" title="10 islem geri">-10</button>
            <button class="skip-btn" onclick="skipTrades(-1)" title="1 islem geri">-1</button>

            <button class="play-btn" id="play-btn">
                <svg id="icon-play" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z" />
                </svg>
                <svg id="icon-pause" viewBox="0 0 24 24" style="display:none;">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                </svg>
            </button>

            <button class="skip-btn" onclick="skipTrades(1)" title="1 islem ileri">+1</button>
            <button class="skip-btn" onclick="skipTrades(10)" title="10 islem ileri">+10</button>
            <button class="skip-btn" onclick="skipTrades(100)" title="100 islem ileri">+100</button>
        </div>

        <div class="progress-container">
            <div class="time-label" id="time-current">--:--:--</div>
            <input type="range" id="timeline" min="0" max="100" value="0" step="0.1">
            <div class="time-label" id="time-end">--:--:--</div>
        </div>

        <div class="settings-area">
            <div class="dropdown" id="indicator-dropdown">
                <button class="dropdown-btn" onclick="document.getElementById('indicator-dropdown').classList.toggle('show')">İndikatörler ▾</button>
                <div class="dropdown-content">
                    <label><input type="checkbox" id="cvd-toggle" checked> CVD</label>
                </div>
            </div>
            <span style="font-size: 12px; color: var(--text-muted);">FPS:</span>
            <select id="fps-select" style="margin-right: 8px;">
                <option value="60" selected>60</option>
                <option value="30">30</option>
                <option value="15">15</option>
            </select>
            <span style="font-size: 12px; color: var(--text-muted);">Hiz:</span>
            <select id="speed-select">
                <option value="0.1">0.1x</option>
                <option value="1" selected>1x</option>
                <option value="10">10x</option>
                <option value="50">50x</option>
                <option value="250">250x</option>
                <option value="1000">1000x</option>
            </select>
        </div>
    </div>

    <script>
        const TRADES_FILE = '{{ trades_file }}';
        const SYMBOL = '{{ symbol }}';
        const TIME_SUFFIX = '{{ time_suffix }}';

        // DOM Elements
        const elLoading = document.getElementById('loading');
        const elTradesList = document.getElementById('trades-list');
        const elPlayBtn = document.getElementById('play-btn');
        const elIconPlay = document.getElementById('icon-play');
        const elIconPause = document.getElementById('icon-pause');
        const elTimeline = document.getElementById('timeline');
        const elTimeCurrent = document.getElementById('time-current');
        const elTimeEnd = document.getElementById('time-end');
        const elSpeed = document.getElementById('speed-select');
        const elFps = document.getElementById('fps-select');
        const elCurrentPrice = document.getElementById('current-price-display');
        const elWhaleFilter = document.getElementById('whale-filter');
        const chartContainer = document.getElementById('chart-container');
        const elCvdToggle = document.getElementById('cvd-toggle');

        // State
        let allTrades = [];
        let liquidations = [];
        let candleHistory = [];
        let currentTradeIndex = 0;

        let startTime = 0;
        let endTime = 100000;
        let currentTimeMs = 0;

        let isPlaying = false;
        let playbackSpeed = 10;
        let targetFps = 60;
        let lastFrameTime = 0;
        let animationFrameId = null;
        let currentCVD = 0;

        // Audio Context for Whale alerts
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playWhalePing() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // --- CHART SETUP ---
        const chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
            layout: { background: { type: 'solid', color: '#0a0e17' }, textColor: '#667788' },
            grid: { vertLines: { color: '#1e2a3a' }, horzLines: { color: '#1e2a3a' } },
            timeScale: { timeVisible: true, secondsVisible: true },
            crosshair: { mode: 0 }
        });

        // 1. Candlestick
        const candleSeries = chart.addCandlestickSeries({
            upColor: '#00e676', downColor: '#ff1744',
            borderUpColor: '#00e676', borderDownColor: '#ff1744',
            wickUpColor: '#00e676', wickDownColor: '#ff1744',
            priceFormat: { type: 'price', precision: 5, minMove: 0.00001 }
        });
        chart.priceScale('right').applyOptions({
            scaleMargins: {
                top: 0.1,
                bottom: 0.25, // Leave bottom 25% empty for volume/CVD
            }
        });

        // 2. Volume overlay
        const volumeSeries = chart.addHistogramSeries({
            color: '#26a69a',
            priceFormat: { type: 'volume' },
            priceScaleId: '',
        });
        chart.priceScale('').applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });

        // 3. CVD Series
        const cvdSeries = chart.addLineSeries({
            color: '#ba68c8', lineWidth: 2, priceScaleId: 'cvd',
            title: 'CVD'
        });
        chart.priceScale('cvd').applyOptions({ scaleMargins: { top: 0.85, bottom: 0 }, visible: false });


        let currentCandle = null;
        let candleTimeSec = 0;
        const candleVolumes = {};
        const candleTradesCount = {};

        function formatTime(ms) {
            const d = new Date(ms);
            return `${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}:${String(d.getUTCSeconds()).padStart(2, '0')}`;
        }

        function getMarkerForLiq(liq) {
            const isLong = liq.side === 'SELL'; // If they sold forcefully, their Long was liquidated
            return {
                time: Math.floor(liq.time / 1000),
                position: isLong ? 'belowBar' : 'aboveBar',
                color: isLong ? '#ff1744' : '#00e676',
                shape: isLong ? 'arrowUp' : 'arrowDown',
                text: `Liq: ${liq.executedQty}`,
                size: 2
            };
        }

        function renderTrade(trade, silent = false) {
            const isBuy = !trade[3];
            const p = trade[0];
            const q = trade[1];
            const total = p * q;

            const whaleLimit = parseFloat(elWhaleFilter.value) || 0;
            if (whaleLimit > 0 && total < whaleLimit) return; // Filter out

            const isWhale = whaleLimit > 0 && total >= whaleLimit;
            if (isWhale && !silent) playWhalePing();

            const div = document.createElement('div');
            div.className = `trade-row ${isBuy ? 'buy' : 'sell'} ${isWhale ? 'whale-glow' : ''}`;
            div.innerHTML = `
                <div class="price">${p.toFixed(5)}</div>
                <div class="qty">${q.toFixed(2)}</div>
                <div class="total" style="text-align: right; color: #ccc;">${total.toFixed(0)}</div>
                <div class="time">${formatTime(trade[2])}</div>
            `;
            elTradesList.prepend(div);
            if (elTradesList.children.length > 50) elTradesList.removeChild(elTradesList.lastChild);
            elCurrentPrice.innerHTML = `<span style="color: ${isBuy ? '#00e676' : '#ff1744'}; font-weight:700; font-size:18px;">${p}</span>`;
        }



        let liqIndex = 0;
        let liqMarkers = [];

        function processTradeForChart(trade) {
            const p = trade[0], q = trade[1], t = trade[2], isBuy = !trade[3];
            const tradeSecond = Math.floor(t / 1000);

            if (tradeSecond !== candleTimeSec) {
                if (currentCandle) {
                    candleSeries.update(currentCandle);
                    volumeSeries.update({ time: currentCandle.time, value: candleVolumes[currentCandle.time], color: currentCandle.close >= currentCandle.open ? 'rgba(0,230,118,0.5)' : 'rgba(255,23,68,0.5)' });
                    cvdSeries.update({ time: currentCandle.time, value: currentCVD });
                }

                candleTimeSec = tradeSecond;
                currentCandle = { time: candleTimeSec, open: p, high: p, low: p, close: p };
                candleVolumes[candleTimeSec] = q;
                candleTradesCount[candleTimeSec] = 1;
            } else {
                currentCandle.high = Math.max(currentCandle.high, p);
                currentCandle.low = Math.min(currentCandle.low, p);
                currentCandle.close = p;
                candleVolumes[candleTimeSec] += q;
                candleTradesCount[candleTimeSec] = (candleTradesCount[candleTimeSec] || 0) + 1;
            }

            currentCVD += (isBuy ? q : -q);

            // Check Liquidations
            let newLiq = false;
            while (liqIndex < liquidations.length && liquidations[liqIndex].time <= t) {
                const liqMarker = getMarkerForLiq(liquidations[liqIndex]);
                liqMarkers.push(liqMarker);
                newLiq = true;
                liqIndex++;
            }
            if (newLiq) {
                candleSeries.setMarkers(liqMarkers);
            }
        }

        function tick(timestamp) {
            if (!lastFrameTime) lastFrameTime = timestamp;
            const deltaMs = timestamp - lastFrameTime;
            const msPerFrame = 1000 / targetFps;

            if (deltaMs < msPerFrame && targetFps < 60) {
                animationFrameId = requestAnimationFrame(tick);
                return;
            }

            lastFrameTime = timestamp;

            if (isPlaying) {
                currentTimeMs += (deltaMs * playbackSpeed);
                if (currentTimeMs >= endTime) {
                    currentTimeMs = endTime;
                    togglePlay(false);
                }
                updateUI();
            }
            animationFrameId = requestAnimationFrame(tick);
        }

        function updateUI() {
            let tradesProcessed = 0;
            let lastTrades = [];
            while (currentTradeIndex < allTrades.length && allTrades[currentTradeIndex][2] <= currentTimeMs) {
                const trade = allTrades[currentTradeIndex];
                processTradeForChart(trade);
                lastTrades.push(trade);
                if (lastTrades.length > 20) lastTrades.shift();
                tradesProcessed++;
                currentTradeIndex++;
            }

            for (let i = 0; i < lastTrades.length; i++) {
                if (i >= lastTrades.length - 10) renderTrade(lastTrades[i]);
            }

            if (tradesProcessed > 0 && currentCandle) {
                candleSeries.update(currentCandle);
            }

            const progress = (currentTimeMs - startTime) / (endTime - startTime) * 100;
            elTimeline.value = progress;
            elTimeCurrent.textContent = formatTime(currentTimeMs);
        }

        // --- BUFFERING & INITIALIZATION ---
        async function loadAuxData() {
            const resLiq = await fetch(`/api/liquidations?symbol=${SYMBOL}&time_suffix=${TIME_SUFFIX}`);
            liquidations = await resLiq.json();
        }

        async function init() {
            try {
                // Fetch first chunk
                const resTrades = await fetch(`/api/trades?file=${encodeURIComponent(TRADES_FILE)}&offset=0&limit=50000`);
                const chunk = await resTrades.json();

                if (!chunk || chunk.length === 0) {
                    document.getElementById('loading-text').textContent = "Veri bulunamadi.";
                    return;
                }

                allTrades = chunk;
                startTime = allTrades[0][2];
                endTime = allTrades[allTrades.length - 1][2]; // Temp end time
                currentTimeMs = startTime;

                elTimeCurrent.textContent = formatTime(startTime);
                elTimeEnd.textContent = formatTime(endTime);

                document.getElementById('loading-text').textContent = "Ek Veriler Yukleniyor...";
                await loadAuxData();

                elLoading.style.display = 'none';
                animationFrameId = requestAnimationFrame(tick);

                // Start background chunk fetcher
                fetchRemainingChunks(50000);

            } catch (err) {
                document.getElementById('loading-text').textContent = "Hata: " + err.message;
            }
        }

        async function fetchRemainingChunks(startOffset) {
            let offset = startOffset;
            let limit = 50000;
            let loadingUI = document.getElementById('loading-progress');

            while (true) {
                try {
                    const res = await fetch(`/api/trades?file=${encodeURIComponent(TRADES_FILE)}&offset=${offset}&limit=${limit}`);
                    const chunk = await res.json();
                    if (chunk.length === 0) break; // Finished

                    allTrades = allTrades.concat(chunk);
                    endTime = allTrades[allTrades.length - 1][2];
                    elTimeEnd.textContent = formatTime(endTime);
                    offset += limit;

                    // Show a little indicator if we are playing near the buffer edge
                    // We can just silently buffer.
                } catch (e) {
                    break;
                }
            }
            console.log("All chunks loaded into memory. Total trades:", allTrades.length);
        }

        // --- CONTROLS ---
        function togglePlay(forceState) {
            isPlaying = forceState !== undefined ? forceState : !isPlaying;
            if (isPlaying) {
                elIconPlay.style.display = 'none';
                elIconPause.style.display = 'block';
                lastFrameTime = performance.now();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } else {
                elIconPlay.style.display = 'block';
                elIconPause.style.display = 'none';
            }
        }

        elPlayBtn.addEventListener('click', () => togglePlay());
        elSpeed.addEventListener('change', (e) => playbackSpeed = parseFloat(e.target.value));
        elFps.addEventListener('change', (e) => targetFps = parseInt(e.target.value));
        elCvdToggle.addEventListener('change', (e) => {
            cvdSeries.applyOptions({ visible: e.target.checked });
        });

        window.addEventListener('click', function(event) {
            if (!event.target.matches('.dropdown-btn')) {
                var dropdowns = document.getElementsByClassName("dropdown");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        });

        function seek(percent) {
            currentTimeMs = startTime + (endTime - startTime) * (percent / 100);
            currentCVD = 0;
            liqIndex = 0;
            oiIndex = 0;
            liqMarkers = [];
            // We would need to rebuild chart data up to currentTimeMs to be accurate

            // Now rebuild chart up to this index
            rebuildChartUpToCurrent();

            // Sync OI and Liquidations
            while (oiIndex < openInterestData.length && openInterestData[oiIndex].timestamp <= currentTimeMs) oiIndex++;
            while (liqIndex < liquidations.length && liquidations[liqIndex].time <= currentTimeMs) liqIndex++;

            elTimeCurrent.textContent = formatTime(currentTimeMs);
        }

        function rebuildChartUpToCurrent() {
            candleHistory = [];
            for (let key in candleVolumes) delete candleVolumes[key];
            for (let key in candleTradesCount) delete candleTradesCount[key];
            currentCVD = 0;

            let tempSec = 0;
            let tempCandle = null;
            const cvdMap = {};

            currentTradeIndex = 0;
            while (currentTradeIndex < allTrades.length && allTrades[currentTradeIndex][2] <= currentTimeMs) {
                const t = allTrades[currentTradeIndex];
                const sec = Math.floor(t[2] / 1000);
                const isBuy = !t[3];

                if (sec !== tempSec) {
                    if (tempCandle) candleHistory.push(tempCandle);
                    tempSec = sec;
                    tempCandle = { time: sec, open: t[0], high: t[0], low: t[0], close: t[0], volume: t[1] };
                } else {
                    tempCandle.high = Math.max(tempCandle.high, t[0]);
                    tempCandle.low = Math.min(tempCandle.low, t[0]);
                    tempCandle.close = t[0];
                    tempCandle.volume += t[1];
                }

                candleVolumes[sec] = (candleVolumes[sec] || 0) + t[1];
                candleTradesCount[sec] = (candleTradesCount[sec] || 0) + 1;

                let cvdDelta = isBuy ? t[1] : -t[1];
                currentCVD += cvdDelta;
                cvdMap[sec] = currentCVD;
                
                currentTradeIndex++;
            }
            if (tempCandle) candleHistory.push(tempCandle);

            // Update global state for next ticks
            candleTimeSec = tempSec;
            currentCandle = tempCandle ? { ...tempCandle } : null;

            if (candleHistory.length > 2000) candleHistory = candleHistory.slice(-2000);

            candleSeries.setData(candleHistory);

            const volumeData = [];
            const cvdData = [];
            candleHistory.forEach(c => {
                candleVolumes[c.time] = c.volume;
                volumeData.push({ time: c.time, value: c.volume, color: c.close >= c.open ? 'rgba(0,230,118,0.5)' : 'rgba(255,23,68,0.5)' });
                cvdData.push({ time: c.time, value: cvdMap[c.time] });
            });
            volumeSeries.setData(volumeData);
            cvdSeries.setData(cvdData);

            if (candleHistory.length > 0) {
                currentCandle = candleHistory[candleHistory.length - 1];
                candleTimeSec = currentCandle.time;
            }

            liqIndex = 0;
            liqMarkers = [];
            while (liqIndex < liquidations.length && liquidations[liqIndex].time <= currentTimeMs) {
                liqMarkers.push(getMarkerForLiq(liquidations[liqIndex]));
                liqIndex++;
            }
            candleSeries.setMarkers(liqMarkers);


            elTradesList.innerHTML = '';
            let lastTrades = [];
            for (let i = Math.max(0, currentTradeIndex - 20); i < currentTradeIndex; i++) {
                lastTrades.push(allTrades[i]);
            }
            for (let i = 0; i < lastTrades.length; i++) {
                renderTrade(lastTrades[i], true);
            }
        }

        elTimeline.addEventListener('input', (e) => {
            if (isPlaying) togglePlay(false);
            const percent = parseFloat(e.target.value);
            currentTimeMs = startTime + (endTime - startTime) * (percent / 100);
            elTimeCurrent.textContent = formatTime(currentTimeMs);
        });

        elTimeline.addEventListener('change', (e) => {
            seek(parseFloat(e.target.value));
        });

        // Panel Resizer Logic
        const resizerEl = document.getElementById('resizer');
        const tradesSectionEl = document.querySelector('.trades-section');
        let isResizing = false;

        resizerEl.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'col-resize';
            e.preventDefault();
        });
        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const containerRect = document.querySelector('.main-content').getBoundingClientRect();
            let newWidth = containerRect.right - e.clientX;
            if (newWidth < 250) newWidth = 250;
            if (newWidth > 800) newWidth = 800;
            tradesSectionEl.style.width = newWidth + 'px';
        });
        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = 'default';
            }
        });

        // Resize chart observer
        const chartSection = document.querySelector('.chart-section');
        new ResizeObserver(entries => {
            if (entries.length === 0 || entries[0].target !== chartSection) return;
            const newRect = entries[0].contentRect;
            chart.applyOptions({ width: newRect.width, height: newRect.height });
        }).observe(chartSection);

        const elLegend = document.getElementById('chart-legend');
        chart.subscribeCrosshairMove(param => {
            if (param.point === undefined || !param.time || param.point.x < 0 || param.point.y < 0) {
                elLegend.style.display = 'none';
                return;
            }

            const candleData = param.seriesData.get(candleSeries);
            const cvdData = param.seriesData.get(cvdSeries);
            
            if (!candleData) {
                elLegend.style.display = 'none';
                return;
            }

            elLegend.style.display = 'block';
            
            const o = candleData.open.toFixed(4);
            const h = candleData.high.toFixed(4);
            const l = candleData.low.toFixed(4);
            const c = candleData.close.toFixed(4);
            
            const v = (candleVolumes[param.time] || 0).toFixed(2);
            const tc = candleTradesCount[param.time] || 0;
            const cvdVal = cvdData ? cvdData.value.toFixed(2) : '0.00';
            
            elLegend.innerHTML = `O: <span style="color:#fff">${o}</span> | H: <span style="color:#fff">${h}</span> | L: <span style="color:#fff">${l}</span> | C: <span style="color:#fff">${c}</span><br>
                                  Vol: <span style="color:#fff">${v}</span> | Trades: <span style="color:#fff">${tc}</span> | CVD: <span style="color:#ba68c8">${cvdVal}</span>`;
        });

        function skipTrades(count) {
            if (isPlaying) togglePlay(false);
            
            if (allTrades.length === 0) return;
            
            currentTradeIndex += count;
            if (currentTradeIndex < 0) currentTradeIndex = 0;
            if (currentTradeIndex >= allTrades.length) currentTradeIndex = allTrades.length - 1;
            
            currentTimeMs = allTrades[currentTradeIndex][2];
            const percent = ((currentTimeMs - startTime) / (endTime - startTime)) * 100;
            elTimeline.value = percent;
            seek(percent);
        }

        init();
    </script>
</body>

</html>
